name: test
on:
  workflow_call:
    inputs:
      haxe:
        required: true
        type: string
      arch:
        required: true
        type: string
      sep:
        required: true
        type: string
      ext:
        required: true
        type: string
      os:
        required: true
        type: string

env:
  HXCPP_ARCH_FLAG: ${{ inputs.arch == 'Arm64' && 'HXCPP_ARM64' || format('HXCPP_M{0}', inputs.arch) }}
  # hxcpp's compile cache, so a job that builds several programs compiles the
  # runtime once: the regression suite alone builds eight
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp-cache

jobs:
  haxe:
    runs-on: ${{ inputs.os }}
    name: haxe
    defaults:
      run:
        working-directory: test/haxe
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
      - name: build
        run: haxe compile.hxml -D ${{ env.HXCPP_ARCH_FLAG }}
      - name: run
        run: bin${{ inputs.sep }}TestMain

  big_blocks:
    runs-on: ${{ inputs.os }}
    name: haxe (big blocks)
    defaults:
      run:
        working-directory: test/haxe
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
      - name: build
        run: haxe compile.hxml --debug -D HXCPP_GC_BIG_BLOCKS -D ${{ env.HXCPP_ARCH_FLAG }}
      - name: run
        run: bin${{ inputs.sep }}TestMain-debug

  cffi:
    runs-on: ${{ inputs.os }}
    name: cffi
    defaults:
      run:
        working-directory: test/cffi
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
      - name: build project
        working-directory: test/cffi/project
        run: haxelib run hxcpp build.xml -Ddebug -D${{ env.HXCPP_ARCH_FLAG }}
      - name: build
        run: haxe compile.hxml --debug -D ${{ env.HXCPP_ARCH_FLAG }}
      - name: build (utf8)
        run: haxe compile-utf8.hxml --debug -D ${{ env.HXCPP_ARCH_FLAG }}
      - name: build (neko)
        run: haxe compile-neko.hxml --debug -D ${{ env.HXCPP_ARCH_FLAG }}
      - name: copy
        run: cp project/ndll/*/prime${{ inputs.ext }} bin/neko/prime.ndll
      - name: run
        run: bin${{ inputs.sep }}cpp${{ inputs.sep }}TestMain-debug
      - name: run (utf8)
        run: bin${{ inputs.sep }}cpp-utf8${{ inputs.sep }}TestMain-debug
      - name: run (neko)
        if: inputs.arch == '64'
        working-directory: test/cffi/bin/neko
        run: neko TestMain.n

  telemetry:
    strategy:
      fail-fast: false
      matrix:
        mode: [ debug, release ]
        include:
          - suffix: -debug
            mode: debug
    runs-on: ${{ inputs.os }}
    name: telemetry (${{ matrix.mode }})
    defaults:
      run:
        working-directory: test/telemetry
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
      - name: build
        run: haxe compile.hxml ${{ matrix.suffix }} -D ${{ env.HXCPP_ARCH_FLAG }}
      - name: run
        run: bin${{ inputs.sep }}TestMain${{ matrix.suffix }}

  debugger:
    runs-on: ${{ inputs.os }}
    name: debugger
    defaults:
      run:
        working-directory: test/debugger
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
      - name: build
        run: haxe compile.hxml -D ${{ env.HXCPP_ARCH_FLAG }}
      - name: run
        run: bin${{ inputs.sep }}App-debug

  native:
      runs-on: ${{ inputs.os }}
      name: native
      defaults:
        run:
          working-directory: test/native
      steps:
        - name: checkout
          uses: actions/checkout@v4
        - name: setup
          uses: ./.github/workflows/setup
          with:
            haxe: ${{ inputs.haxe }}
        - name: build
          run: haxe compile.hxml -D ${{ env.HXCPP_ARCH_FLAG }}
        - name: run
          run: bin${{ inputs.sep }}Native

  std:
      runs-on: ${{ inputs.os }}
      name: std
      defaults:
        run:
          working-directory: test/std
      steps:
        - name: checkout
          uses: actions/checkout@v4
        - name: setup
          uses: ./.github/workflows/setup
          with:
            haxe: ${{ inputs.haxe }}
        - name: setup mariadb
          if: runner.os == 'Linux'
          run: |
            set -ex
            sudo apt-get update -qqy
            sudo apt-get install -qqy mariadb-server
            sudo systemctl start mariadb
            sudo mariadb -u root -e "create database hxcpp; grant all privileges on hxcpp.* to hxcpp@localhost identified by 'hxcpp'; flush privileges;"
        - name: build
          run: haxe compile${{ inputs.arch }}.hxml
        - name: run
          env:
            # the MySQL tests fail, rather than pass, without the server above
            HXCPP_TEST_MYSQL: ${{ runner.os == 'Linux' && '1' || '' }}
          run: ${{ inputs.arch == 'Arm64' && 'arm64' || format('cpp{0}', inputs.arch) }}${{ inputs.sep }}Test

  cppia:
    strategy:
      fail-fast: false
      matrix:
        mode: [ interp, jit ]
        include:
          - suffix: -jit
            mode: jit
    runs-on: ${{ inputs.os }}
    name: cppia (${{ matrix.mode }})
    defaults:
      run:
        working-directory: test/cppia
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
      - name: build host
        run: haxe compile-host.hxml -D ${{ env.HXCPP_ARCH_FLAG }}
      - name: build client
        run: haxe compile-client.hxml -D ${{ env.HXCPP_ARCH_FLAG }}
      - name: run
        run: bin${{ inputs.sep }}CppiaHost bin${{ inputs.sep }}client.cppia ${{ matrix.suffix }}

  suite:
    runs-on: ${{ inputs.os }}
    name: haxe test suite
    defaults:
      run:
        working-directory: haxe/tests/unit
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
      - name: haxe tests
        uses: ./.github/workflows/haxe-tests
        with:
          haxe: ${{ inputs.haxe }}
      - name: build
        run: haxe compile-cpp.hxml -D ${{ env.HXCPP_ARCH_FLAG }} -D no_http
      - name: run
        run: bin${{ inputs.sep }}cpp${{ inputs.sep }}TestMain-debug

  # The rest of what Haxe's own CI runs for C++ (tests/runci/targets/Cpp.hx),
  # so the runtime keeps doing what the compiler and the standard library
  # expect of it. Each suite runs even when one before it failed
  haxe_suites:
    runs-on: ${{ inputs.os }}
    name: haxe sys, threads and cppia suites
    # a hung thread test would otherwise hold the runner for six hours
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
      - name: haxe tests
        uses: ./.github/workflows/haxe-tests
        with:
          haxe: ${{ inputs.haxe }}
      - name: sys
        working-directory: haxe/tests/sys
        run: |
          haxe -D $HXCPP_ARCH_FLAG --each compile-cpp.hxml
          EXISTS=1 bin/cpp/Main-debug
      - name: threads
        if: ${{ !cancelled() }}
        working-directory: haxe/tests/threads
        run: |
          haxe -D $HXCPP_ARCH_FLAG build.hxml -cpp export/cpp
          export/cpp/Main
      - name: event loop
        if: ${{ !cancelled() }}
        working-directory: haxe/tests/misc/eventLoop
        run: |
          haxe -D $HXCPP_ARCH_FLAG build-cpp.hxml
          cpp/Main
      - name: misc
        if: ${{ !cancelled() }}
        working-directory: haxe/tests/misc/cpp
        run: haxe run.hxml
      - name: cppia
        if: ${{ !cancelled() }}
        working-directory: haxe/tests/unit
        run: |
          haxe compile-cppia-host.hxml -D $HXCPP_ARCH_FLAG
          haxe compile-cppia.hxml -D no_http
          bin/cppia/Host-debug bin/unit.cppia
          bin/cppia/Host-debug bin/unit.cppia -jit

  build_tool:
    runs-on: ${{ inputs.os }}
    name: build tool tests
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
      - name: test c/cxx_standard attributes
        working-directory: test/cxx_standard
        shell: bash
        run: |
          for xml in *.xml; do
            haxelib run hxcpp $xml
            haxelib run hxcpp $xml clean
          done

  regression:
    runs-on: ${{ inputs.os }}
    name: regression tests
    defaults:
      run:
        working-directory: test/regression
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
      - name: run
        run: haxe --run Run -D ${{ env.HXCPP_ARCH_FLAG }}
