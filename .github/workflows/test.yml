name: test
on:
  workflow_call:
    inputs:
      haxe:
        required: true
        type: string
      arch:
        required: true
        type: string
      sep:
        required: true
        type: string
      ext:
        required: true
        type: string
      os:
        required: true
        type: string
      label:
        required: true
        type: string

env:
  HXCPP_ARCH_FLAG: ${{ inputs.arch == 'Arm64' && 'HXCPP_ARM64' || format('HXCPP_M{0}', inputs.arch) }}
  # hxcpp's compile cache, so a job that builds several programs compiles the
  # runtime once: the regression suite alone builds eight
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp-cache

jobs:
  haxe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ''
            flags: ''
            bin: TestMain
          - variant: ' (big blocks)'
            flags: --debug -D HXCPP_GC_BIG_BLOCKS
            bin: TestMain-debug
          - variant: ' (moving gc)'
            flags: --debug -D HXCPP_GC_DEBUG_ALWAYS_MOVE
            bin: TestMain-debug
          - variant: ' (gc verify)'
            flags: -D HXCPP_GC_VERIFY
            bin: TestMain
    runs-on: ${{ inputs.os }}
    name: '${{ inputs.label }}: runtime${{ matrix.variant }}'
    defaults:
      run:
        working-directory: test/haxe
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
      - name: build
        run: haxe compile.hxml ${{ matrix.flags }} -D ${{ env.HXCPP_ARCH_FLAG }}
      - name: run
        run: bin${{ inputs.sep }}${{ matrix.bin }}

  cffi:
    runs-on: ${{ inputs.os }}
    name: '${{ inputs.label }}: cffi'
    defaults:
      run:
        working-directory: test/cffi
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
      - name: build project
        working-directory: test/cffi/project
        run: haxelib run hxcpp build.xml -Ddebug -D${{ env.HXCPP_ARCH_FLAG }}
      - name: build
        run: haxe compile.hxml --debug -D ${{ env.HXCPP_ARCH_FLAG }}
      - name: build (utf8)
        run: haxe compile-utf8.hxml --debug -D ${{ env.HXCPP_ARCH_FLAG }}
      - name: build (neko)
        run: haxe compile-neko.hxml --debug -D ${{ env.HXCPP_ARCH_FLAG }}
      - name: copy
        run: cp project/ndll/*/prime${{ inputs.ext }} bin/neko/prime.ndll
      - name: run
        run: bin${{ inputs.sep }}cpp${{ inputs.sep }}TestMain-debug
      - name: run (utf8)
        run: bin${{ inputs.sep }}cpp-utf8${{ inputs.sep }}TestMain-debug
      - name: run (neko)
        if: inputs.arch == '64'
        working-directory: test/cffi/bin/neko
        run: neko TestMain.n

  telemetry:
    strategy:
      fail-fast: false
      matrix:
        mode: [ debug, release ]
        include:
          - suffix: -debug
            mode: debug
    runs-on: ${{ inputs.os }}
    name: '${{ inputs.label }}: telemetry (${{ matrix.mode }})'
    defaults:
      run:
        working-directory: test/telemetry
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
      - name: build
        run: haxe compile.hxml ${{ matrix.suffix }} -D ${{ env.HXCPP_ARCH_FLAG }}
      - name: run
        run: bin${{ inputs.sep }}TestMain${{ matrix.suffix }}

  debugger:
    runs-on: ${{ inputs.os }}
    name: '${{ inputs.label }}: debugger'
    defaults:
      run:
        working-directory: test/debugger
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
      - name: build
        run: haxe compile.hxml -D ${{ env.HXCPP_ARCH_FLAG }}
      - name: run
        run: bin${{ inputs.sep }}App-debug

  native:
      runs-on: ${{ inputs.os }}
      name: '${{ inputs.label }}: native'
      defaults:
        run:
          working-directory: test/native
      steps:
        - name: checkout
          uses: actions/checkout@v4
        - name: setup
          uses: ./.github/workflows/setup
          with:
            haxe: ${{ inputs.haxe }}
        - name: build
          run: haxe compile.hxml -D ${{ env.HXCPP_ARCH_FLAG }}
        - name: run
          run: bin${{ inputs.sep }}Native

  std:
      runs-on: ${{ inputs.os }}
      name: '${{ inputs.label }}: std'
      defaults:
        run:
          working-directory: test/std
      steps:
        - name: checkout
          uses: actions/checkout@v4
        - name: setup
          uses: ./.github/workflows/setup
          with:
            haxe: ${{ inputs.haxe }}
        - name: setup mariadb
          if: runner.os == 'Linux'
          run: |
            set -ex
            sudo apt-get update -qqy
            sudo apt-get install -qqy mariadb-server
            sudo systemctl start mariadb
            sudo mariadb -u root -e "create database hxcpp; grant all privileges on hxcpp.* to hxcpp@localhost identified by 'hxcpp'; flush privileges;"
        - name: build
          run: haxe compile${{ inputs.arch }}.hxml
        - name: run
          env:
            HXCPP_TEST_MYSQL: ${{ runner.os == 'Linux' && '1' || '' }}
          run: ${{ inputs.arch == 'Arm64' && 'arm64' || format('cpp{0}', inputs.arch) }}${{ inputs.sep }}Test

  cppia:
    runs-on: ${{ inputs.os }}
    name: '${{ inputs.label }}: cppia'
    defaults:
      run:
        working-directory: test/cppia
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
      - name: build host
        run: haxe compile-host.hxml -D ${{ env.HXCPP_ARCH_FLAG }}
      - name: build client
        run: haxe compile-client.hxml -D ${{ env.HXCPP_ARCH_FLAG }}
      - name: run
        run: bin${{ inputs.sep }}CppiaHost bin${{ inputs.sep }}client.cppia
      - name: run with the jit
        if: ${{ !cancelled() }}
        run: bin${{ inputs.sep }}CppiaHost bin${{ inputs.sep }}client.cppia -jit

  suite:
    runs-on: ${{ inputs.os }}
    name: '${{ inputs.label }}: haxe unit'
    defaults:
      run:
        working-directory: haxe/tests/unit
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
      - name: haxe tests
        uses: ./.github/workflows/haxe-tests
        with:
          haxe: ${{ inputs.haxe }}
      - name: build
        run: haxe compile-cpp.hxml -D ${{ env.HXCPP_ARCH_FLAG }} -D no_http
      - name: run
        run: bin${{ inputs.sep }}cpp${{ inputs.sep }}TestMain-debug

  # The rest of Haxe's own C++ CI, tests/runci/targets/Cpp.hx
  haxe_suites:
    runs-on: ${{ inputs.os }}
    name: '${{ inputs.label }}: haxe sys, threads, cppia'
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
      - name: haxe tests
        uses: ./.github/workflows/haxe-tests
        with:
          haxe: ${{ inputs.haxe }}
      - name: sys
        working-directory: haxe/tests/sys
        run: |
          # as Haxe's CI does: APFS refuses file names that are not valid Unicode
          if [ "$RUNNER_OS" = macOS ]; then echo "" > compile-fs.hxml; fi
          haxe -D $HXCPP_ARCH_FLAG --each compile-cpp.hxml
          EXISTS=1 bin/cpp/Main-debug
      - name: threads
        if: ${{ !cancelled() }}
        working-directory: haxe/tests/threads
        run: |
          haxe -D $HXCPP_ARCH_FLAG build.hxml -cpp export/cpp
          export/cpp/Main
      - name: event loop
        if: ${{ !cancelled() }}
        working-directory: haxe/tests/misc/eventLoop
        run: |
          haxe -D $HXCPP_ARCH_FLAG build-cpp.hxml
          cpp/Main
      - name: misc
        if: ${{ !cancelled() }}
        working-directory: haxe/tests/misc/cpp
        run: haxe run.hxml
      - name: cppia
        if: ${{ !cancelled() }}
        working-directory: haxe/tests/unit
        run: |
          haxe compile-cppia-host.hxml -D $HXCPP_ARCH_FLAG
          haxe compile-cppia.hxml -D no_http
          bin/cppia/Host-debug bin/unit.cppia
          bin/cppia/Host-debug bin/unit.cppia -jit

  build_tool:
    runs-on: ${{ inputs.os }}
    name: '${{ inputs.label }}: build tool'
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
      - name: test c/cxx_standard attributes
        working-directory: test/cxx_standard
        shell: bash
        run: |
          for xml in *.xml; do
            haxelib run hxcpp $xml
            haxelib run hxcpp $xml clean
          done
      - name: test -options relative to the working directory
        working-directory: test/build_options
        shell: bash
        run: |
          haxelib run hxcpp xml/Build.xml -options options.txt
          test "$(./value | tr -d '\r')" = 42
      - name: test the MSVC setup scripts with ! in the Visual Studio path
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File test/msvc_setup/check.ps1
      - name: test the build profile on a 64-bit Raspberry Pi
        if: runner.os == 'Linux'
        run: bash test/rpi_host/check.sh

  regression:
    runs-on: ${{ inputs.os }}
    name: '${{ inputs.label }}: regression'
    defaults:
      run:
        working-directory: test/regression
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: ${{ inputs.haxe }}
      - name: run
        run: haxe --run Run -D ${{ env.HXCPP_ARCH_FLAG }}
      # Moves the system clock, which the Windows runners don't allow
      - name: stop time sync
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo timedatectl set-ntp false
          else
            sudo systemsetup -setusingnetworktime off
          fi
      - name: build the clock change test
        if: runner.os != 'Windows'
        working-directory: test/clock_change
        run: haxe build.hxml -D ${{ env.HXCPP_ARCH_FLAG }}
      - name: run the clock change test
        if: runner.os != 'Windows'
        working-directory: test/clock_change
        run: bin/Main
