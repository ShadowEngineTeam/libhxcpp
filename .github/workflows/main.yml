name: main
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE.txt'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE.txt'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the run in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-headers:
    name: Check headers
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: Install pcre2grep
      run: sudo apt-get update && sudo apt-get install -y pcre2-utils

    - run: |
        # macros in public headers must use the global namespace to qualify types
        ! pcre2grep --buffer-size=1M --recursive --multiline --line-number --include='.*\.h$' \
          '#define\s+(?:.*\\\r?\n)*.*?\K(?<!:)\b(Enum|String|StringOffset|Array|ArrayClassID|Math|Math_obj|Void|null|Dynamic|hx::|cpp::)\b' \
          include
      name: Check public headers

  check-gc-defines:
    name: Check GC defines
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - run: bash test/gc-defines/check.sh
      name: Compile the GC under each define

  check-haxelib:
    name: Check installing with haxelib
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - uses: krdlab/setup-haxe@v2
      with:
        haxe-version: 4.3.7

    - run: bash test/haxelib/check.sh
      name: Install, setup, update and off
      # Git Bash on Windows
      shell: bash

  Windows32:
    strategy:
      fail-fast: false
      matrix:
        haxe: [ 4.3.7, latest ]
    uses: ./.github/workflows/test.yml
    name: Test Windows (32bit)
    with:
      haxe: ${{ matrix.haxe  }}
      arch: 32
      sep: \
      ext: .dll
      os: windows-latest

  Windows64:
    strategy:
      fail-fast: false
      matrix:
        haxe: [ 4.3.7, latest ]
    uses: ./.github/workflows/test.yml
    name: Test Windows (64bit)
    with:
      haxe: ${{ matrix.haxe  }}
      arch: 64
      sep: \
      ext: .dll
      os: windows-latest

  MacOS64:
    strategy:
      fail-fast: false
      matrix:
        haxe: [ 4.3.7, latest ]
    uses: ./.github/workflows/test.yml
    name: Test MacOS (x86_64)
    with:
      haxe: ${{ matrix.haxe  }}
      arch: 64
      sep: /
      ext: .dylib
      os: macos-15-intel

  MacOSArm:
    strategy:
      fail-fast: false
      matrix:
        haxe: [ 4.3.7, latest ]
    uses: ./.github/workflows/test.yml
    name: Test MacOS (Arm64)
    with:
      haxe: ${{ matrix.haxe  }}
      arch: Arm64
      sep: /
      ext: .dylib
      os: macos-latest

  Linux32:
    strategy:
      fail-fast: false
      matrix:
        haxe: [ 4.3.7, latest ]
    uses: ./.github/workflows/test.yml
    name: Test Linux (32bit)
    with:
      haxe: ${{ matrix.haxe  }}
      arch: 32
      sep: /
      ext: .dso
      os: ubuntu-latest

  Linux64:
    strategy:
      fail-fast: false
      matrix:
        haxe: [ 4.3.7, latest ]
    uses: ./.github/workflows/test.yml
    name: Test Linux (64bit)
    with:
      haxe: ${{ matrix.haxe  }}
      arch: 64
      sep: /
      ext: .dso
      os: ubuntu-latest
