name: main
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE.txt'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE.txt'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the run in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-headers:
    name: Check headers
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: Install pcre2grep
      run: sudo apt-get update && sudo apt-get install -y pcre2-utils

    - run: |
        # macros in public headers must use the global namespace to qualify types
        ! pcre2grep --buffer-size=1M --recursive --multiline --line-number --include='.*\.h$' \
          '#define\s+(?:.*\\\r?\n)*.*?\K(?<!:)\b(Enum|String|StringOffset|Array|ArrayClassID|Math|Math_obj|Void|null|Dynamic|hx::|cpp::)\b' \
          include
      name: Check public headers

  check-gc-defines:
    name: Check GC defines
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - run: bash test/gc-defines/check.sh
      name: Compile the GC under each define

  check-mac-arm64-capture:
    name: Check GC register capture for macOS arm64
    runs-on: macos-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    # an Xcode arm64 build that defines HXCPP_M64 but not HXCPP_ARM64
    - run: clang++ -arch arm64 -std=c++11 -c -DHX_MACOS -DHXCPP_M64 -Iinclude src/hx/gc/GcRegCapture.cpp -o capture.o
      name: Compile the register capture

  check-msvc-llvm:
    name: Check MSVC builds with clang-cl
    runs-on: windows-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: setup
      uses: ./.github/workflows/setup
      with:
        haxe: 4.3.7

    - name: Build the runtime tests
      working-directory: test/haxe
      run: haxe compile.hxml -D HXCPP_MSVC_LLVM -D HXCPP_M64

    - name: Run the runtime tests
      working-directory: test/haxe
      run: bin\TestMain

  check-android:
    name: Build for Android (${{ matrix.abi }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            flag: HXCPP_ARM64
          - abi: armeabi-v7a
            flag: HXCPP_ARMV7
          - abi: x86_64
            flag: HXCPP_X86_64
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: setup
      uses: ./.github/workflows/setup
      with:
        haxe: 4.3.7

    - name: Use the runner's NDK
      run: echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

    # Built and not run, which would need a device or an emulator
    - name: Build the runtime tests
      working-directory: test/haxe
      run: haxe compile.hxml -D android -D ${{ matrix.flag }}

    - name: Build the native tests
      working-directory: test/native
      run: haxe compile.hxml -D android -D ${{ matrix.flag }}

    - name: Build the std tests
      working-directory: test/std
      run: haxe -m Test -L hx4compat -L utest --cpp android -D android -D exe_link -D ${{ matrix.flag }}

  check-apple-ssl:
    name: Check SSL for iOS and tvOS
    runs-on: macos-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    # at the toolchains' default minimum, so the pre-12 trust evaluation compiles too
    - run: |
        flags="-std=c++11 -c -arch arm64 -Iinclude -Iproject/thirdparty/mbedtls-3.6.7/include -Iproject/thirdparty/config/mbedtls/include -DMBEDTLS_USER_CONFIG_FILE=<mbedtls_config.h> -DHXCPP_M64 -DHXCPP_ARM64"
        xcrun --sdk iphoneos clang++ $flags -miphoneos-version-min=9.0 -DIPHONE=IPHONE -DIPHONEOS=IPHONEOS src/hx/libs/ssl/SSL.cpp -o ssl-ios.o
        xcrun --sdk appletvos clang++ $flags -mtvos-version-min=9.0 -DAPPLETV=APPLETV src/hx/libs/ssl/SSL.cpp -o ssl-tvos.o
      name: Compile the SSL library

  check-run-bindir:
    name: Check run.n finds the compiled BuildTool (${{ matrix.dir }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dir: Linux64
          - os: macos-15-intel
            dir: Mac64
          - os: macos-latest
            dir: MacArm64
    runs-on: ${{ matrix.os }}
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - uses: krdlab/setup-haxe@v2
      with:
        haxe-version: 4.3.7

    - run: bash test/run_bindir/check.sh ${{ matrix.dir }}
      name: Run through run.n

  check-musl:
    name: Check Linux with musl
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: setup
      uses: ./.github/workflows/setup
      with:
        haxe: 4.3.7

    - name: Generate the regression tests
      working-directory: test/regression
      run: for test in */; do haxe -C $test build.hxml -D no-compilation -D HXCPP_M64; done

    # Alpine packages Neko only in edge so far
    - name: Build and run the regression tests on Alpine
      run: docker run --rm -v "$PWD:/w" -w /w alpine:edge sh -c "apk add --no-cache neko g++ linux-headers && sh test/regression/run-generated.sh"

  check-haxelib:
    name: Check installing with haxelib
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - uses: krdlab/setup-haxe@v2
      with:
        haxe-version: 4.3.7

    - run: bash test/haxelib/check.sh
      name: Install, setup, update and off
      # Git Bash on Windows
      shell: bash


  # The test suites on every platform with the stable Haxe; nightly.yml runs
  # them with the Haxe nightly build once a day
  platforms:
    name: Haxe 4.3.7
    uses: ./.github/workflows/platforms.yml
    with:
      haxe: 4.3.7
