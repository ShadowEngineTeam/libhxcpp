name: gc soak
# Runs one GC stress mode, or the test/haxe suite, over and over for a while,
# to catch failures too rare for the jobs in main.yml. Started by hand, or by
# pushing a soak/ branch.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to keep running the program on each OS
        default: '45'
      program:
        description: What to run, the GC stress test or the test/haxe suite
        type: choice
        options: [stress, haxe]
        default: stress
      flags:
        description: Defines for the build
        default: '-D HXCPP_GC_GENERATIONAL -D HXCPP_GC_VERIFY'
  push:
    branches: ['soak/**']

jobs:
  soak:
    name: Soak on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Room for setup, the build and the run still going when time is up.
    # Expressions have no arithmetic, so this picks a step above the minutes
    timeout-minutes: ${{ fromJSON(inputs.minutes || '45') <= 70 && 90 || (fromJSON(inputs.minutes || '45') <= 160 && 180 || 360) }}
    defaults:
      run:
        shell: bash
    env:
      MINUTES: ${{ inputs.minutes || '45' }}
      PROGRAM: ${{ inputs.program || 'stress' }}
      FLAGS: ${{ inputs.flags || '-D HXCPP_GC_GENERATIONAL -D HXCPP_GC_VERIFY' }}
    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: setup
      uses: ./.github/workflows/setup
      with:
        haxe: 4.3.7

    - name: Build
      run: |
        dir=$([ "$PROGRAM" = haxe ] && echo test/haxe || echo test/gc_stress)
        cd $dir
        haxe compile.hxml $FLAGS -D ${{ startsWith(matrix.os, 'macos') && 'HXCPP_ARM64' || 'HXCPP_M64' }}

    - name: Install gdb
      if: runner.os == 'Linux'
      run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb

    # The stress test alternates 4 and 8 threads. On Linux and macOS each run
    # is under a debugger, which prints every thread's stack if it crashes or
    # traps; on Windows only the exit status is kept. Every failing run's
    # output is kept.
    - name: Run it until the time is up
      run: |
        traced="$GITHUB_WORKSPACE/.github/workflows/traced.sh"
        if [ "$PROGRAM" = haxe ]; then cd test/haxe; else cd test/gc_stress; fi
        deadline=$(( $(date +%s) + MINUTES * 60 ))
        runs=0; failures=0
        while [ $(date +%s) -lt $deadline ]; do
          runs=$((runs + 1))
          threads=$(( runs % 2 == 0 ? 8 : 4 ))
          # The step runs under bash -e, so a failing run must not end the loop
          status=0
          if [ "$PROGRAM" = haxe ]; then
            bash "$traced" bin/TestMain > run.txt 2>&1 || status=$?
          else
            bash "$traced" bin/Stress 60 $threads > run.txt 2>&1 || status=$?
          fi
          echo "exit status $status" >> run.txt
          if [ $status -ne 0 ]; then
            failures=$((failures + 1))
            echo "::error::run $runs failed"
            cat run.txt
          fi
        done
        echo "$failures of $runs runs failed"
        [ $failures -eq 0 ]
