name: release
# Releases the version written in haxelib.json, from main, once CI has passed
# on that commit. Run it from the Actions tab. See RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      allow_failed_ci:
        description: Release even though CI did not pass on this commit (say why in the release notes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  Check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Release from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main, not ${{ github.ref }}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Check the version and Changes.md
        id: version
        run: haxe -p tools/release --run Release check >> "$GITHUB_OUTPUT"

      - name: Check the version is not released yet
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag is already released; set the next version in haxelib.json and Changes.md"
            exit 1
          fi

      - name: Check CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh api "repos/${{ github.repository }}/actions/workflows/main.yml/runs?head_sha=${{ github.sha }}&event=push&per_page=1" \
            --jq '.workflow_runs[0] | "\(.status // "none")/\(.conclusion // "none")"')
          echo "CI on ${{ github.sha }}: $result"
          if [ "$result" != "completed/success" ]; then
            if [ "${{ inputs.allow_failed_ci }}" = "true" ]; then
              echo "::warning::Releasing although CI on this commit is $result (allow_failed_ci)"
            else
              echo "::error::CI on this commit is $result; wait for it to pass, or run again with allow_failed_ci"
              exit 1
            fi
          fi

  Package:
    needs: Check
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Set Haxelib
        run: |
          haxe -version
          haxelib dev libhxcpp .
          haxelib run libhxcpp setup

      - name: Stamp the version
        run: haxe -p tools/release --run Release stamp

      - name: Build Tool
        run: |
          cd tools/hxcpp
          haxe compile.hxml

      - name: Check XCode
        if: startsWith(matrix.os,'macos')
        run: xcode-select -p

      - name: Build Cppia
        run: |
          cd project
          haxe compile-cppia.hxml -D HXCPP_M64

      - name: Clean Project
        if: startsWith(matrix.os,'ubuntu')
        run: |
          rm -rf project/cppia_bin

      - name: Archive Linux Results
        if: startsWith(matrix.os,'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: linux-64
          path: |
             bin/Linux64/Cppia
             tools
             toolchain
             src
             run.n
             include
             hxcpp.n
             haxelib.json
             extraParams.hxml
             Changes.md
             hxcpp
             test
             docs
             project
             README.md
             build-tool
             java
             haxelib.xml
             LICENSE.txt

      - name: Archive Windows Results
        if: startsWith(matrix.os,'windows')
        uses: actions/upload-artifact@v4
        with:
          name: windows-64
          path: |
            bin/Windows64/Cppia.exe

      - name: Archive Mac Results
        if: startsWith(matrix.os,'macos')
        uses: actions/upload-artifact@v4
        with:
          name: mac-64
          path: |
            bin/Mac64/Cppia

  Release:
    needs: [Check, Package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.Check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Release notes
        run: haxe -p tools/release --run Release notes "$RUNNER_TEMP/notes.md"

      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-64
          path: package

      - name: Download Mac
        uses: actions/download-artifact@v4
        with:
          name: mac-64
          path: package/bin/Mac64/

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-64
          path: package/bin/Windows64/

      - name: Zip release
        run: |
          mv package "libhxcpp-$VERSION"
          zip -qr "libhxcpp-$VERSION.zip" "libhxcpp-$VERSION"

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION }}
          commit: ${{ github.sha }}
          name: libhxcpp ${{ env.VERSION }}
          bodyFile: ${{ runner.temp }}/notes.md
          prerelease: ${{ needs.Check.outputs.prerelease }}
          draft: false
          artifacts: ./libhxcpp-${{ env.VERSION }}.zip
