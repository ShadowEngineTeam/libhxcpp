name: platforms
# The test suites on every platform, for one version of Haxe. main runs them
# with the stable Haxe on every change, and nightly with the Haxe nightly build.
on:
  workflow_call:
    inputs:
      haxe:
        required: true
        type: string

jobs:
  Windows32:
    uses: ./.github/workflows/test.yml
    name: Test Windows (32bit)
    with:
      haxe: ${{ inputs.haxe }}
      arch: 32
      sep: \
      ext: .dll
      os: windows-latest

  Windows64:
    uses: ./.github/workflows/test.yml
    name: Test Windows (64bit)
    with:
      haxe: ${{ inputs.haxe }}
      arch: 64
      sep: \
      ext: .dll
      os: windows-latest

  MacOS64:
    uses: ./.github/workflows/test.yml
    name: Test MacOS (x86_64)
    with:
      haxe: ${{ inputs.haxe }}
      arch: 64
      sep: /
      ext: .dylib
      os: macos-15-intel

  MacOSArm:
    uses: ./.github/workflows/test.yml
    name: Test MacOS (Arm64)
    with:
      haxe: ${{ inputs.haxe }}
      arch: Arm64
      sep: /
      ext: .dylib
      os: macos-latest

  Linux32:
    uses: ./.github/workflows/test.yml
    name: Test Linux (32bit)
    with:
      haxe: ${{ inputs.haxe }}
      arch: 32
      sep: /
      ext: .dso
      os: ubuntu-latest

  Linux64:
    uses: ./.github/workflows/test.yml
    name: Test Linux (64bit)
    with:
      haxe: ${{ inputs.haxe }}
      arch: 64
      sep: /
      ext: .dso
      os: ubuntu-latest
