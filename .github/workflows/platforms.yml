name: platforms
# The test suites on every platform, for one version of Haxe. main runs them
# with the stable Haxe on every change, and nightly with the Haxe nightly build.
on:
  workflow_call:
    inputs:
      haxe:
        required: true
        type: string

jobs:
  Windows32:
    uses: ./.github/workflows/test.yml
    name: Windows 32
    with:
      label: Windows 32
      haxe: ${{ inputs.haxe }}
      arch: 32
      sep: \
      ext: .dll
      os: windows-latest

  Windows64:
    uses: ./.github/workflows/test.yml
    name: Windows 64
    with:
      label: Windows 64
      haxe: ${{ inputs.haxe }}
      arch: 64
      sep: \
      ext: .dll
      os: windows-latest

  MacOS64:
    uses: ./.github/workflows/test.yml
    name: macOS Intel
    with:
      label: macOS Intel
      haxe: ${{ inputs.haxe }}
      arch: 64
      sep: /
      ext: .dylib
      os: macos-15-intel

  MacOSArm:
    uses: ./.github/workflows/test.yml
    name: macOS arm64
    with:
      label: macOS arm64
      haxe: ${{ inputs.haxe }}
      arch: Arm64
      sep: /
      ext: .dylib
      os: macos-latest

  Linux32:
    uses: ./.github/workflows/test.yml
    name: Linux 32
    with:
      label: Linux 32
      haxe: ${{ inputs.haxe }}
      arch: 32
      sep: /
      ext: .dso
      os: ubuntu-latest

  Linux64:
    uses: ./.github/workflows/test.yml
    name: Linux 64
    with:
      label: Linux 64
      haxe: ${{ inputs.haxe }}
      arch: 64
      sep: /
      ext: .dso
      os: ubuntu-latest
