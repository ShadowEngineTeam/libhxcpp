name: haxe tests
description: Checks out Haxe's own test suites, at the commit of the Haxe being tested, into haxe/tests
inputs:
  haxe:
    required: true
    type: string
runs:
  using: composite
  steps:
    - name: get the haxe commit
      if: inputs.haxe == 'latest'
      id: haxe_sha
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version=$(haxe --version)
        short_sha=${version##*+}
        full_sha=$(gh api repos/HaxeFoundation/haxe/commits/$short_sha --jq '.sha')
        echo "Haxe $version is commit $full_sha"
        echo "sha=$full_sha" >> "$GITHUB_OUTPUT"

    - name: checkout haxe
      uses: actions/checkout@v7
      with:
        repository: HaxeFoundation/haxe
        path: haxe
        ref: ${{ inputs.haxe == 'latest' && steps.haxe_sha.outputs.sha || inputs.haxe }}
        sparse-checkout: tests

    # Haxe 4's tests do not build with the git utest that setup installs
    - name: install utest
      if: inputs.haxe != 'latest'
      shell: bash
      run: haxelib install utest --always

    # preview.1's Issue12264 expects Type.typeof(0i64) to be TInt on cpp, which
    # held only because hxcpp boxed Int64s from -1 to 255 out of its Int cache
    # (HaxeFoundation/hxcpp#1278). libhxcpp fixed that, and Haxe has since
    # rewritten the test as Type.typeof(256i64).match(TInt64)
    - name: leave out tests that preview.1 got wrong
      if: inputs.haxe == '5.0.0-preview.1'
      shell: bash
      run: rm haxe/tests/unit/src/unit/issues/Issue12264.hx
